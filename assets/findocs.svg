<svg xmlns="http://www.w3.org/2000/svg" width="880" height="266" viewBox="0 0 880 266" role="img" aria-labelledby="title desc">
  <title id="title">FinDocs · пример ответа</title>
  <desc id="desc">На вопрос о первых климатических облигациях FinDocs отвечает со ссылкой на TXT-источник.</desc>
  <rect x="1" y="1" width="878" height="264" rx="12" fill="#ffffff" stroke="#d8dee4" stroke-width="2"/>
  <path d="M31 63h818" stroke="#d8dee4"/>
  <g font-family="Arial,sans-serif" fill="#24292f">
    <text x="33" y="43" font-size="21" font-weight="600">Пример из демо</text>
    <text x="847" y="43" text-anchor="end" font-family="monospace" font-size="18" fill="#57606a">demo_reference.txt</text>
    <text x="33" y="104" font-size="24" font-weight="600">Кто первым выпустил климатические облигации?</text>
    <text x="33" y="147" font-size="23">Европейский инвестиционный банк <tspan fill="#b84316">[1]</tspan></text>
    <rect x="31" y="174" width="818" height="63" rx="5" fill="#fff2e9"/>
    <path d="M32 181v48" stroke="#b84316" stroke-width="3" stroke-linecap="round"/>
    <text x="48" y="211" font-size="21" fill="#24292f">«…Европейским инвестиционным банком (ЕИБ) в июле 2007 года…»</text>
  </g>
</svg>
