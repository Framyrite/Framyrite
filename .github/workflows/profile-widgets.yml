name: Обновление активности профиля

on:
  push:
    paths:
      - '.github/workflows/profile-widgets.yml'
      - 'scripts/render_widgets.py'
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-widgets
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Построить график по публичным коммитам
        env:
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/render_widgets.py "$PROFILE_LOGIN"
      - name: Опубликовать изменения
        run: |
          git add assets/profile-activity.svg assets/profile-activity-dark.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Update public profile activity'
          git push
